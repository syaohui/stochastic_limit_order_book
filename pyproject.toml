[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-lob"
version = "0.3.0"
description = "Stochastic models of the limit order book, order flow, price impact and liquidity provision: slide decks, verified code, and estimators for LOBSTER data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yaohui Shu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
keywords = [
    "limit order book",
    "market microstructure",
    "stochastic processes",
    "Hawkes process",
    "queueing",
    "market making",
    "price impact",
    "latent order book",
    "micro-price",
    "LOBSTER",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/syaohui/stochastic_limit_order_book"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stochastic_lob = ["journal.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
